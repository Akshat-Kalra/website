<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ $.Site.Params.description }}{{ end }}" />

  <title>
    {{ if not .IsHome }}
      {{ .Title }}
    {{ else }}
      {{ $.Site.Title }}
    {{ end }}
  </title>

  <link rel="icon" type="image/svg+xml" href="{{ "letter_a.svg" | relURL }}" />
  <link rel="shortcut icon" type="image/png" href="{{ "letter_a.png" | relURL }}" />
  {{ $options := (dict "outputStyle" "compressed" "enableSourceMap" (not hugo.IsProduction)) }}
  {{ $sass := resources.Get "css/main.scss" }}
  {{ $style := $sass | css.Sass $options | resources.Fingerprint "sha512" }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" />
  <style>
    .role { text-decoration: underline; text-underline-offset: 0.15em; }
    .mast {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.25rem;
    }
    .mast h1 { margin: 0; }
    .mast p { margin: 0.35rem 0 0; }
    pre.cats {
      background: none;
      padding: 0;
      margin: 0;
      flex: 0 0 auto;
      width: max-content;
      font-size: 0.75em;
      line-height: 1.2;
      opacity: 0.55;
    }
    @media (max-width: 640px) {
      .w {
        padding: calc(2.25rem + env(safe-area-inset-top, 0px)) 1.25rem 3rem;
      }
      h1 { margin-top: 0; }
      pre.cats { font-size: 0.58em; }
    }
    body[a] a.role,
    body[a] a.role:link,
    body[a] a.role:visited,
    body[a] a.role:hover,
    body[a] a.role:active {
      color: #000;
    }
    @media (prefers-color-scheme: dark) {
      body[a="auto"] a.role,
      body[a="auto"] a.role:link,
      body[a="auto"] a.role:visited,
      body[a="auto"] a.role:hover,
      body[a="auto"] a.role:active {
        color: #fff;
      }
    }
    body[a="dark"] a.role,
    body[a="dark"] a.role:link,
    body[a="dark"] a.role:visited,
    body[a="dark"] a.role:hover,
    body[a="dark"] a.role:active {
      color: #fff;
    }
  </style>
  {{ if .Params.mathjax }} {{ partial "mathjax.html" . }} {{ end }}
</head>
