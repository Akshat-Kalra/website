<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ $.Site.Params.description }}{{ end }}" />

  <title>
    {{ if not .IsHome }}
      {{ .Title }}
    {{ else }}
      {{ $.Site.Title }}
    {{ end }}
  </title>

  <link rel="icon" type="image/svg+xml" href="{{ "letter_a.svg" | relURL }}" />
  <link rel="shortcut icon" type="image/png" href="{{ "letter_a.png" | relURL }}" />
  {{ $options := (dict "outputStyle" "compressed" "enableSourceMap" (not hugo.IsProduction)) }}
  {{ $sass := resources.Get "css/main.scss" }}
  {{ $style := $sass | css.Sass $options | resources.Fingerprint "sha512" }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" />
  <style>
    .role { text-decoration: underline; text-underline-offset: 0.15em; }
  </style>
  {{ if .Params.mathjax }} {{ partial "mathjax.html" . }} {{ end }}
</head>
